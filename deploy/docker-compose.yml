services:
  orchestrator:
    build:
      context: ../services/orchestrator
    env_file:
      - ../.env.example
    environment:
      - UVICORN_WORKERS=2
      - ARTIFACT_STORAGE_DIR=/tmp/doc_optimizer_artifacts
    ports:
      - "8080:8080"
    volumes:
      - orchestrator_artifacts:/tmp/doc_optimizer_artifacts
    depends_on:
      - qdrant
      - llm

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  llm:
    image: ollama/ollama:0.4.7
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  qdrant_data:
  ollama_data:
  orchestrator_artifacts:
