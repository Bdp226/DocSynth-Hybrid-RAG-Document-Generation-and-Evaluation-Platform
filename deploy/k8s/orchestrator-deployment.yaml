apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: doc-optimizer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: orchestrator
        image: doc-optimizer-orchestrator:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
        - name: UVICORN_WORKERS
          value: "4"
        - name: ARTIFACT_STORAGE_DIR
          value: /var/lib/docsynth/artifacts
        - name: READINESS_REQUIRES_LLM
          value: "true"
        envFrom:
        - configMapRef:
            name: orchestrator-config
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: artifacts
          mountPath: /var/lib/docsynth/artifacts
        - name: tmp
          mountPath: /tmp
        - name: app-build
          mountPath: /app/build
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        # Startup probe absorbs cold-start model discovery so a slow first boot
        # never trips the liveness probe into a restart loop.
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 30
          periodSeconds: 5
        # Readiness checks real dependencies and pulls the pod out of rotation.
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Liveness is dependency-free on purpose: a failing LLM must not cause
        # a pod restart, only a readiness failure.
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 20
          periodSeconds: 15
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              # Let in-flight compose requests drain before the pod terminates.
              command: ["sh", "-c", "sleep 15"]
      terminationGracePeriodSeconds: 60
      volumes:
      - name: artifacts
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: app-build
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: doc-optimizer
spec:
  selector:
    app: orchestrator
  ports:
  - name: http
    port: 8080
    targetPort: http
