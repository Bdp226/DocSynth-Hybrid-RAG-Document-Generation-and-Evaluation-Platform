apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: doc-optimizer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
      - name: orchestrator
        image: doc-optimizer-orchestrator:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: UVICORN_WORKERS
          value: "4"
        envFrom:
        - configMapRef:
            name: orchestrator-config
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: artifacts
          mountPath: /tmp/doc_optimizer_artifacts
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: artifacts
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: doc-optimizer
spec:
  selector:
    app: orchestrator
  ports:
  - port: 8080
    targetPort: 8080
